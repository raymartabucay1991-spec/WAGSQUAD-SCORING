<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="format-detection"
    content="telephone=no"
>

<title>WAGSQUAD-SCORING</title>


<style>

/* =========================================================
   GLOBAL
   ========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    background: #0d1117;
}

body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

    background: #0d1117;
    color: #e6edf3;

    overflow-x: hidden;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

button,
select,
input {
    font-family: inherit;
}


/* =========================================================
   CONTAINER
   ========================================================= */

.container {
    width: calc(100% - 30px);
    max-width: 1400px;

    margin: 25px auto;

    padding-bottom:
        max(20px, env(safe-area-inset-bottom));
}


/* =========================================================
   TITLE
   ========================================================= */

h1 {
    text-align: center;

    margin:
        0 0 8px 0;

    font-size: 32px;
    line-height: 1.2;
}

.subtitle {
    text-align: center;

    color: #8b949e;

    margin-bottom: 25px;

    line-height: 1.4;
}


/* =========================================================
   TOP SECTION
   ========================================================= */

.top-section {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1.5fr);

    gap: 20px;
}


/* =========================================================
   CARD
   ========================================================= */

.card {
    width: 100%;
    min-width: 0;

    background: #161b22;

    border:
        1px solid
        #30363d;

    border-radius: 10px;

    padding: 20px;

    overflow: hidden;
}

.card-title {
    font-size: 20px;
    font-weight: bold;

    margin-bottom: 18px;

    line-height: 1.3;
}


/* =========================================================
   CURRENCY INPUTS
   ========================================================= */

.currency-header,
.currency-row {
    display: grid;

    grid-template-columns:
        minmax(70px, 1fr)
        minmax(80px, 1fr)
        minmax(80px, 1fr);

    gap: 10px;

    align-items: center;
}

.currency-header {
    color: #8b949e;

    font-size: 13px;
    font-weight: bold;

    margin-bottom: 8px;

    padding: 0 8px;
}

.currency-row {
    padding: 8px;

    border-bottom:
        1px solid
        #21262d;
}

.currency-name {
    font-weight: bold;
    font-size: 16px;
}


/* =========================================================
   SELECT
   ========================================================= */

select {
    width: 100%;
    min-width: 0;

    height: 42px;

    padding:
        8px
        10px;

    border-radius: 6px;

    border:
        1px solid
        #30363d;

    background: #0d1117;

    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    -webkit-appearance: menulist;
    appearance: auto;
}


/* =========================================================
   SCORE COLORS
   ========================================================= */

select.positive {
    border-color: #238636;
    color: #3fb950;
}

select.negative {
    border-color: #da3633;
    color: #f85149;
}

select.zero {
    border-color: #8b949e;
    color: #8b949e;
}


/* INVALID SCORE */
select.invalid-score {
    border-color: #8b949e;
    color: #8b949e;
}


/* =========================================================
   WAG COLORS
   ========================================================= */

select.wag-select.h1 {
    border-color: #1f6feb;
    color: #58a6ff;
}

select.wag-select.h4 {
    border-color: #8957e5;
    color: #bc8cff;
}

select.wag-select.d1 {
    border-color: #d29922;
    color: #e3b341;
}

select.wag-select.zero {
    border-color: #8b949e;
    color: #8b949e;
}


/* =========================================================
   RESET BUTTON
   ========================================================= */

.reset-btn {
    width: 100%;
    min-height: 44px;

    margin-top: 18px;

    padding: 11px;

    background: #da3633;
    color: white;

    border: none;
    border-radius: 6px;

    font-weight: bold;
    font-size: 15px;

    cursor: pointer;

    -webkit-appearance: none;
    appearance: none;

    touch-action: manipulation;
}

.reset-btn:hover {
    background: #f85149;
}

.reset-btn:active {
    transform: scale(0.99);
}


/* =========================================================
   FINAL FILTER
   ========================================================= */

.filter-header,
.filter-row {
    display: grid;

    grid-template-columns:
        minmax(55px, 0.8fr)
        minmax(45px, 0.7fr)
        minmax(80px, 1.1fr)
        minmax(100px, 1.4fr)
        minmax(55px, 0.7fr);

    gap: 10px;

    align-items: center;
}

.filter-header {
    color: #8b949e;

    font-size: 13px;
    font-weight: bold;

    padding:
        0
        10px
        8px;
}

.filter-row {
    padding:
        12px
        10px;

    border-top:
        1px solid
        #21262d;
}

.filter-pair {
    font-weight: bold;
    font-size: 16px;

    overflow-wrap: anywhere;
}

.filter-gap {
    font-weight: bold;
}

.positive-gap {
    color: #3fb950;
}

.negative-gap {
    color: #f85149;
}

.neutral-gap {
    color: #8b949e;
}


/* =========================================================
   BIAS
   ========================================================= */

.buy {
    color: #3fb950;
    font-weight: bold;
}

.sell {
    color: #f85149;
    font-weight: bold;
}

.invalid {
    color: #8b949e;
    font-weight: bold;
}


/* =========================================================
   WAG RESULT
   ========================================================= */

.filter-wag {
    font-weight: bold;

    font-size: 13px;

    line-height: 1.5;

    min-width: 0;

    overflow-wrap: anywhere;
}

.wag-h1 {
    color: #58a6ff;
}

.wag-h4 {
    color: #bc8cff;
}

.wag-d1 {
    color: #e3b341;
}

.empty-message {
    text-align: center;

    color: #8b949e;

    padding:
        25px
        10px;

    line-height: 1.5;
}


/* =========================================================
   ALL PAIRS
   ========================================================= */

.all-pairs-card {
    margin-top: 20px;
}

.pairs-table-wrapper {
    width: 100%;

    overflow-x: auto;

    -webkit-overflow-scrolling: touch;
}

.pairs-table {
    width: 100%;
    min-width: 500px;

    border-collapse: collapse;
}

.pairs-table th,
.pairs-table td {
    padding: 11px;

    border-bottom:
        1px solid
        #21262d;

    text-align: left;

    white-space: nowrap;
}

.pairs-table th {
    color: #8b949e;
    font-size: 13px;
}

.pair-name {
    font-weight: bold;
}

.trend-cell {
    color: #8b949e;
}


/* =========================================================
   IPHONE / MOBILE
   ========================================================= */

@media (max-width: 1000px) {

    .top-section {
        grid-template-columns: 1fr;
    }

}


/* =========================================================
   SMALL TABLETS / LARGE PHONES
   ========================================================= */

@media (max-width: 700px) {

    .container {
        width: calc(100% - 20px);

        margin:
            15px auto;
    }

    h1 {
        font-size: 25px;
    }

    .subtitle {
        font-size: 13px;

        margin-bottom: 18px;
    }

    .card {
        padding: 14px;

        border-radius: 8px;
    }

    .card-title {
        font-size: 18px;

        margin-bottom: 15px;
    }

    .currency-header,
    .currency-row {
        grid-template-columns:
            0.8fr
            1fr
            1fr;

        gap: 6px;
    }

    .currency-header {
        font-size: 12px;

        padding:
            0
            5px
            6px;
    }

    .currency-row {
        padding:
            7px
            5px;
    }

    .currency-name {
        font-size: 14px;
    }

    select {
        height: 42px;

        padding:
            7px
            6px;

        font-size: 15px;
    }

    .filter-header,
    .filter-row {
        grid-template-columns:
            0.8fr
            0.7fr
            1fr
            1.3fr
            0.7fr;

        gap: 5px;

        font-size: 11px;
    }

    .filter-header {
        padding:
            0
            5px
            7px;
    }

    .filter-row {
        padding:
            11px
            5px;
    }

    .filter-pair {
        font-size: 13px;
    }

    .filter-wag {
        font-size: 11px;
    }

    .reset-btn {
        min-height: 46px;

        font-size: 14px;
    }

    .pairs-table th,
    .pairs-table td {
        padding:
            9px
            6px;

        font-size: 12px;
    }

}


/* =========================================================
   VERY SMALL IPHONES
   ========================================================= */

@media (max-width: 390px) {

    .container {
        width: calc(100% - 12px);

        margin:
            10px auto;
    }

    .card {
        padding: 10px;
    }

    h1 {
        font-size: 22px;
    }

    .subtitle {
        font-size: 12px;
    }

    .currency-header,
    .currency-row {
        grid-template-columns:
            0.7fr
            1fr
            1fr;

        gap: 4px;
    }

    .currency-name {
        font-size: 13px;
    }

    select {
        height: 40px;

        font-size: 14px;

        padding:
            6px
            4px;
    }

    .filter-header,
    .filter-row {
        grid-template-columns:
            0.75fr
            0.65fr
            0.9fr
            1.2fr
            0.65fr;

        gap: 3px;
    }

    .filter-header {
        font-size: 9px;
    }

    .filter-row {
        font-size: 10px;
    }

    .filter-pair {
        font-size: 11px;
    }

    .filter-wag {
        font-size: 10px;
    }

}


/* =========================================================
   LANDSCAPE IPHONE
   ========================================================= */

@media (max-width: 900px) and (orientation: landscape) {

    .container {
        width: calc(100% - 24px);

        margin:
            15px auto;
    }

    .top-section {
        grid-template-columns:
            1fr
            1.5fr;
    }

    .card {
        padding: 14px;
    }

}


/* =========================================================
   SAFARI SAFE AREA
   ========================================================= */

@supports (padding: max(0px)) {

    body {
        padding-left:
            env(safe-area-inset-left);

        padding-right:
            env(safe-area-inset-right);
    }

}


/* =========================================================
   TOUCH
   ========================================================= */

@media (hover: none) and (pointer: coarse) {

    select,
    button {
        touch-action: manipulation;
    }

}

</style>

<meta
    name="theme-color"
    content="#0d1117"
>

>

>

<body>


<div class="container">


    <!-- =====================================================
         TITLE
         ===================================================== -->

    <h1>
        WAGSQUAD-SCORING
    </h1>


    <div class="subtitle">

        Score → Automatic Trend → GAP → BIAS → Filter

    </div>


    <!-- =====================================================
         TOP SECTION
         ===================================================== -->

    <div class="top-section">


        <!-- =================================================
             CURRENCY INPUTS
             ================================================= -->

        <div class="card">


            <div class="card-title">

                Currency Inputs

            </div>


            <div class="currency-header">

                <div>
                    Currency
                </div>

                <div>
                    Score
                </div>

                <div>
                    WAG BOX
                </div>

            </div>


            <div id="currencyInputs"></div>


            <button
                class="reset-btn"
                onclick="resetScores()"
            >

                RESET SCORES

            </button>


        </div>


        <!-- =================================================
             FINAL FILTER
             ================================================= -->

        <div class="card">


            <div class="card-title">

                Final Filtered Trading Pairs

            </div>


            <div class="filter-header">


                <div>
                    Pair
                </div>


                <div>
                    GAP
                </div>


                <div>
                    WAG BOX
                </div>


                <div>
                    Strong vs Weak
                </div>


                <div>
                    BIAS
                </div>


            </div>


            <div id="finalFilter"></div>


        </div>


    </div>


    <!-- =====================================================
         ALL PAIRS
         ===================================================== -->

    <div class="card all-pairs-card">


        <div class="card-title">

            All Pairs

        </div>


        <div class="pairs-table-wrapper">

            <table class="pairs-table">


                <thead>

                    <tr>

                        <th>
                            Pair
                        </th>

                        <th>
                            GAP
                        </th>

                        <th>
                            BIAS
                        </th>

                        <th>
                            Trend Comparison
                        </th>

                    </tr>

                </thead>


                <tbody id="allPairs"></tbody>


            </table>

        </div>


    </div>


</div>


<script>


/* =========================================================
   CURRENCIES
   ========================================================= */

const currencies = [

    "AUD",
    "CAD",
    "EUR",
    "GBP",
    "JPY",
    "NZD",
    "USD"

];


/* =========================================================
   PAIRS
   ========================================================= */

const pairs = [

    "AUDCAD",
    "AUDJPY",
    "AUDNZD",
    "AUDUSD",

    "CADJPY",

    "EURAUD",
    "EURCAD",
    "EURGBP",
    "EURJPY",
    "EURNZD",
    "EURUSD",

    "GBPAUD",
    "GBPCAD",
    "GBPJPY",
    "GBPNZD",
    "GBPUSD",

    "NZDCAD",
    "NZDJPY",
    "NZDUSD",

    "USDCAD",
    "USDJPY"

];


/* =========================================================
   DEFAULT SCORES
   ========================================================= */

const defaultScores = {

    AUD: 3,
    CAD: -2,
    EUR: -2,
    GBP: -1,
    JPY: 3,
    NZD: -3,
    USD: 5

};


/* =========================================================
   DEFAULT WAG
   ========================================================= */

const defaultWag = {

    AUD: "0",
    CAD: "0",
    EUR: "0",
    GBP: "0",
    JPY: "0",
    NZD: "0",
    USD: "0"

};


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

const SCORE_STORAGE_KEY =
    "currencyGapFilterScores";

const WAG_STORAGE_KEY =
    "currencyGapFilterWag";


let scores =
    loadScores();

let wagSettings =
    loadWag();


/* =========================================================
   LOAD SCORES
   ========================================================= */

function loadScores() {

    try {

        const saved =
            localStorage.getItem(
                SCORE_STORAGE_KEY
            );


        if (!saved) {

            return {
                ...defaultScores
            };

        }


        const parsed =
            JSON.parse(saved);


        return {

            ...defaultScores,

            ...parsed

        };

    }

    catch (error) {

        return {
            ...defaultScores
        };

    }

}


/* =========================================================
   LOAD WAG
   ========================================================= */

function loadWag() {

    try {

        const saved =
            localStorage.getItem(
                WAG_STORAGE_KEY
            );


        if (!saved) {

            return {
                ...defaultWag
            };

        }


        const parsed =
            JSON.parse(saved);


        return {

            ...defaultWag,

            ...parsed

        };

    }

    catch (error) {

        return {
            ...defaultWag
        };

    }

}


/* =========================================================
   SAVE SCORES
   ========================================================= */

function saveScores() {

    try {

        localStorage.setItem(

            SCORE_STORAGE_KEY,

            JSON.stringify(scores)

        );

    }

    catch (error) {

        console.log(
            "Unable to save scores."
        );

    }

}


/* =========================================================
   SAVE WAG
   ========================================================= */

function saveWag() {

    try {

        localStorage.setItem(

            WAG_STORAGE_KEY,

            JSON.stringify(wagSettings)

        );

    }

    catch (error) {

        console.log(
            "Unable to save WAG settings."
        );

    }

}


/* =========================================================
   RESET
   ========================================================= */

function resetScores() {

    const confirmed =
        confirm(
            "Reset all currency scores and WAG BOX selections to the default values?"
        );


    if (!confirmed) {

        return;

    }


    scores = {

        ...defaultScores

    };


    wagSettings = {

        ...defaultWag

    };


    saveScores();

    saveWag();


    renderCurrencyInputs();

    calculateAndRender();

}


/* =========================================================
   SCORE OPTIONS
   ========================================================= */

/*
   "i" = INVALID SCORE
*/

const scoreOptions = [
    6,
    5,
    4,
    3,
    2,
    1,
    0,
    "i",
    -1,
    -2,
    -3,
    -4,
    -5,
    -6
];

/* =========================================================
   WAG OPTIONS
   ========================================================= */

const wagOptions = [

    "0",
    "H1",
    "H4",
    "D1"

];


/* =========================================================
   RENDER CURRENCY INPUTS
   ========================================================= */

function renderCurrencyInputs() {

    const container =
        document.getElementById(
            "currencyInputs"
        );


    container.innerHTML = "";


    currencies.forEach(
        currency => {


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "currency-row";


            /* =================================================
               CURRENCY NAME
               ================================================= */

            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "currency-name";


            name.textContent =
                currency;


            /* =================================================
               SCORE SELECT
               ================================================= */

            const scoreSelect =
                document.createElement(
                    "select"
                );


            scoreOptions.forEach(
                score => {


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        score;


                    /*
                       Display:
                       +6 ... +1
                       i
                       -1 ... -6
                    */

                    if (score === "i") {

                        option.textContent =
                            "i";

                    }

                    else {

                        option.textContent =
                            score > 0
                                ? "+" + score
                                : score;

                    }


                    /*
                       Correctly select saved
                       numeric or "i" value.
                    */

                    if (
                        String(
                            scores[currency]
                        ) === String(score)
                    ) {

                        option.selected =
                            true;

                    }


                    scoreSelect.appendChild(
                        option
                    );

                }
            );


            updateSelectColor(
                scoreSelect
            );


            scoreSelect.addEventListener(
                "change",
                function () {


                    /*
                       Keep "i" as a string.
                       Keep numbers as numbers.
                    */

                    if (
                        this.value === "i"
                    ) {

                        scores[currency] =
                            "i";

                    }

                    else {

                        scores[currency] =
                            Number(
                                this.value
                            );

                    }


                    updateSelectColor(
                        this
                    );


                    saveScores();


                    calculateAndRender();

                }
            );


            /* =================================================
               WAG SELECT
               ================================================= */

            const wagSelect =
                document.createElement(
                    "select"
                );


            wagSelect.className =
                "wag-select";


            wagOptions.forEach(
                timeframe => {


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        timeframe;


                    option.textContent =
                        timeframe;


                    if (
                        wagSettings[currency]
                        === timeframe
                    ) {

                        option.selected =
                            true;

                    }


                    wagSelect.appendChild(
                        option
                    );

                }
            );


            updateWagColor(
                wagSelect
            );


            wagSelect.addEventListener(
                "change",
                function () {


                    wagSettings[currency] =
                        this.value;


                    updateWagColor(
                        this
                    );


                    saveWag();


                    calculateAndRender();

                }
            );


            /* =================================================
               ADD ROW
               ================================================= */

            row.appendChild(
                name
            );


            row.appendChild(
                scoreSelect
            );


            row.appendChild(
                wagSelect
            );


            container.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   SCORE COLOR
   ========================================================= */

function updateSelectColor(select) {

    select.classList.remove(

        "positive",
        "negative",
        "zero",
        "invalid-score"

    );


    /*
       "i" = INVALID
    */

    if (
        select.value === "i"
    ) {

        select.classList.add(
            "invalid-score"
        );

        return;

    }


    const value =
        Number(
            select.value
        );


    if (value > 0) {

        select.classList.add(
            "positive"
        );

    }

    else if (value < 0) {

        select.classList.add(
            "negative"
        );

    }

    else {

        select.classList.add(
            "zero"
        );

    }

}


/* =========================================================
   WAG COLOR
   ========================================================= */

function updateWagColor(select) {

    select.classList.remove(

        "zero",
        "h1",
        "h4",
        "d1"

    );


    if (select.value === "0") {

        select.classList.add(
            "zero"
        );

    }

    else if (select.value === "H1") {

        select.classList.add(
            "h1"
        );

    }

    else if (select.value === "H4") {

        select.classList.add(
            "h4"
        );

    }

    else if (select.value === "D1") {

        select.classList.add(
            "d1"
        );

    }

}


/* =========================================================
   SCORE VALIDATION
   ========================================================= */

function isInvalidScore(score) {

    return (
        score === "i" ||
        score === "I"
    );

}


/* =========================================================
   TREND
   ========================================================= */

function getTrend(score) {

    /*
       Invalid score has no trend.
    */

    if (
        isInvalidScore(score)
    ) {

        return "INVALID";

    }


    const numericScore =
        Number(score);


    if (numericScore >= 4) {

        return "STRONG";

    }


    if (numericScore <= -4) {

        return "WEAK";

    }


    return "NEUTRAL";

}


/* =========================================================
   BIAS
   ========================================================= */

function getBias(
    baseTrend,
    quoteTrend
) {


    /*
       Any INVALID trend produces INVALID bias.
    */

    if (
        baseTrend === "INVALID" ||
        quoteTrend === "INVALID"
    ) {

        return "INVALID";

    }


    if (

        baseTrend === "STRONG" &&

        quoteTrend === "WEAK"

    ) {

        return "BUY";

    }


    if (

        baseTrend === "STRONG" &&

        quoteTrend === "NEUTRAL"

    ) {

        return "BUY";

    }


    if (

        baseTrend === "WEAK" &&

        quoteTrend === "STRONG"

    ) {

        return "SELL";

    }


    if (

        baseTrend === "WEAK" &&

        quoteTrend === "NEUTRAL"

    ) {

        return "SELL";

    }


    if (

        baseTrend === "NEUTRAL" &&

        quoteTrend === "STRONG"

    ) {

        return "SELL";

    }


    if (

        baseTrend === "NEUTRAL" &&

        quoteTrend === "WEAK"

    ) {

        return "BUY";

    }


    return "INVALID";

}


/* =========================================================
   CALCULATE PAIR
   ========================================================= */

function calculatePair(pair) {


    const base =
        pair.substring(
            0,
            3
        );


    const quote =
        pair.substring(
            3,
            6
        );


    const baseScore =
        scores[base];


    const quoteScore =
        scores[quote];


    /*
       If either currency is INVALID,
       GAP is also INVALID.
    */

    const invalidPair =

        isInvalidScore(baseScore) ||

        isInvalidScore(quoteScore);


    const gap =

        invalidPair

            ? null

            : Number(baseScore) -
              Number(quoteScore);


    const baseTrend =
        getTrend(
            baseScore
        );


    const quoteTrend =
        getTrend(
            quoteScore
        );


    const trendComparison =

        baseTrend +

        " vs " +

        quoteTrend;


    const bias =
        getBias(

            baseTrend,

            quoteTrend

        );


    return {

        pair,

        base,

        quote,

        baseScore,

        quoteScore,

        gap,

        baseTrend,

        quoteTrend,

        trendComparison,

        bias,

        baseWag:
            wagSettings[base],

        quoteWag:
            wagSettings[quote]

    };

}


/* =========================================================
   GAP CLASS
   ========================================================= */

function getGapClass(gap) {


    /*
       Invalid GAP
    */

    if (
        gap === null ||
        gap === undefined
    ) {

        return "neutral-gap";

    }


    if (gap > 0) {

        return "positive-gap";

    }


    if (gap < 0) {

        return "negative-gap";

    }


    return "neutral-gap";

}


/* =========================================================
   BIAS CLASS
   ========================================================= */

function getBiasClass(bias) {


    if (bias === "BUY") {

        return "buy";

    }


    if (bias === "SELL") {

        return "sell";

    }


    return "invalid";

}


/* =========================================================
   WAG CLASS
   ========================================================= */

function getWagClass(wag) {


    if (wag === "H1") {

        return "wag-h1";

    }


    if (wag === "H4") {

        return "wag-h4";

    }


    if (wag === "D1") {

        return "wag-d1";

    }


    return "";

}


/* =========================================================
   STRONG SCORE
   ========================================================= */

function isStrongScore(score) {

    /*
       Invalid score is never strong.
    */

    if (
        isInvalidScore(score)
    ) {

        return false;

    }


    const numericScore =
        Number(score);


    return (

        numericScore >= 4 ||

        numericScore <= -4

    );

}


/* =========================================================
   WAG RESULT
   ========================================================= */

function getWagResult(
    currency,
    score,
    wag
) {


    if (
        !isStrongScore(score)
    ) {

        return "";

    }


    if (
        wag === "0"
    ) {

        return "";

    }


    const wagClass =
        getWagClass(
            wag
        );


    return `

        <span class="${wagClass}">

            ${currency}: ${wag}

        </span>

    `;

}


/* =========================================================
   FINAL FILTER
   ========================================================= */

function isFinalFilter(pairData) {


    /*
       INVALID pair can NEVER enter
       the final tradeable filter.
    */

    if (
        pairData.bias === "INVALID"
    ) {

        return false;

    }


    if (
        pairData.gap === null
    ) {

        return false;

    }


    const gapQualified =

        pairData.gap >= 5 ||

        pairData.gap <= -5;


    const biasQualified =

        pairData.bias === "BUY" ||

        pairData.bias === "SELL";


    return (

        gapQualified &&

        biasQualified

    );

}


/* =========================================================
   RENDER FINAL FILTER
   ========================================================= */

function renderFinalFilter(data) {


    const container =
        document.getElementById(
            "finalFilter"
        );


    container.innerHTML = "";


    const filtered =
        data.filter(
            isFinalFilter
        );


    if (
        filtered.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-message">

                No trading pairs currently
                meet the filter.

            </div>

        `;

        return;

    }


    filtered.forEach(
        row => {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "filter-row";


            const gapClass =
                getGapClass(
                    row.gap
                );


            const biasClass =
                getBiasClass(
                    row.bias
                );


            const formattedGap =

                row.gap > 0

                    ? "+" + row.gap

                    : row.gap;


            const baseWagResult =
                getWagResult(

                    row.base,

                    row.baseScore,

                    row.baseWag

                );


            const quoteWagResult =
                getWagResult(

                    row.quote,

                    row.quoteScore,

                    row.quoteWag

                );


            let wagHTML = "";


            if (
                baseWagResult !== ""
            ) {

                wagHTML +=
                    baseWagResult;

            }


            if (
                quoteWagResult !== ""
            ) {

                if (
                    wagHTML !== ""
                ) {

                    wagHTML += "<br>";

                }


                wagHTML +=
                    quoteWagResult;

            }


            div.innerHTML = `

                <div class="filter-pair">

                    ${row.pair}

                </div>


                <div class="filter-gap ${gapClass}">

                    ${formattedGap}

                </div>


                <div class="filter-wag">

                    ${wagHTML}

                </div>


                <div class="filter-trend">

                    ${row.trendComparison}

                </div>


                <div class="filter-bias ${biasClass}">

                    ${row.bias}

                </div>

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   RENDER ALL PAIRS
   ========================================================= */

function renderAllPairs(data) {


    const tbody =
        document.getElementById(
            "allPairs"
        );


    tbody.innerHTML = "";


    data.forEach(
        row => {


            const tr =
                document.createElement(
                    "tr"
                );


            const gapClass =
                getGapClass(
                    row.gap
                );


            const biasClass =
                getBiasClass(
                    row.bias
                );


            let formattedGap;


            if (
                row.gap === null
            ) {

                formattedGap = "i";

            }

            else if (
                row.gap > 0
            ) {

                formattedGap =
                    "+" + row.gap;

            }

            else {

                formattedGap =
                    row.gap;

            }


            tr.innerHTML = `

                <td class="pair-name">

                    ${row.pair}

                </td>


                <td class="${gapClass}">

                    ${formattedGap}

                </td>


                <td class="${biasClass}">

                    ${row.bias}

                </td>


                <td class="trend-cell">

                    ${row.trendComparison}

                </td>

            `;


            tbody.appendChild(
                tr
            );

        }
    );

}


/* =========================================================
   CALCULATE AND RENDER
   ========================================================= */

function calculateAndRender() {


    const data =
        pairs.map(
            calculatePair
        );


    renderFinalFilter(
        data
    );


    renderAllPairs(
        data
    );

}


/* =========================================================
   START
   ========================================================= */

renderCurrencyInputs();

calculateAndRender();


</script>
